<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السجلات - ACCE</title>
<link rel="stylesheet" href="styles.css">
<style>
.records-custom{
  padding:0 14px 105px;
  background:linear-gradient(145deg,#eef6ff 0%,#fff 48%,#edf7ff 100%);
  min-height:100vh;
}
.records-hero{
  margin:0 -14px;
  padding:16px 20px 22px;
  background:linear-gradient(135deg,#4c91ef,#3477dc);
  border-radius:0 0 28px 28px;
  box-shadow:0 4px 12px #2d63af26;
}
.records-hero h1{
  margin:0 0 14px;
  text-align:center;
  color:#fff;
  font-size:30px;
  font-weight:800;
}
.records-hero-row{display:flex;align-items:center;gap:12px}
.records-zero{
  flex:1;height:58px;border-radius:32px;background:#fff;color:#2461b9;
  display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900;
}
.records-tutorial{
  width:42%;height:58px;border:0;border-radius:32px;background:#397be2;color:#fff;
  font-family:inherit;font-size:19px;font-weight:800;
}
.records-tabs{
  display:grid;grid-template-columns:repeat(4,1fr);
  margin:26px 0 18px;background:rgba(255,255,255,.94);
}
.records-tab{
  appearance:none;border:0;border-bottom:4px solid transparent;background:transparent;
  padding:0 3px 10px;min-height:70px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:#111;font-family:inherit;font-size:18px;font-weight:700;
  line-height:1.35;cursor:pointer;
}
.records-tab.active{color:#397bdc;border-bottom-color:#397bdc}

/* بطاقات YouTube الكبيرة */
.task-list{
  display:flex;
  flex-direction:column;
  gap:18px;
  padding:0 0 22px;
}
.task-card{
  position:relative;
  width:100%;
  height:116px;
  border:1px solid #e4e4e4;
  border-radius:25px;
  background:#fff;
  box-shadow:0 3px 14px rgba(0,0,0,.10);
  display:flex;
  align-items:center;
  direction:ltr;
  padding:0 22px;
  font-family:inherit;
  cursor:pointer;
  text-align:left;
  box-sizing:border-box;
  transition:transform .12s ease,box-shadow .12s ease;
}
.task-card:active{
  transform:scale(.985);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.task-icon{
  width:58px;
  height:41px;
  min-width:58px;
  border-radius:12px;
  background:#ff0000;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin-right:20px;
}
.task-icon::before{
  content:"";
  width:0;
  height:0;
  border-top:10px solid transparent;
  border-bottom:10px solid transparent;
  border-left:17px solid #fff;
  margin-left:5px;
}
.task-info{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
}
.task-title{
  font-size:23px;
  font-weight:800;
  color:#1765a9;
  margin:0;
  line-height:1;
}
.task-status{display:none}
.task-arrow{
  font-size:48px;
  line-height:1;
  color:#1765a9;
  font-weight:300;
  margin-left:auto;
  padding-left:15px;
}
@media(max-width:500px){
  .task-card{height:116px;border-radius:22px;padding:0 18px}
  .task-icon{width:58px;height:41px;min-width:58px;border-radius:12px;margin-right:20px}
  .task-icon::before{
    border-top-width:12px;border-bottom-width:12px;border-left-width:19px;
  }
  .task-title{font-size:24px}
  .task-arrow{font-size:48px}
}
@media(max-width:380px){
  .task-card{height:110px;padding:0 16px}
  .task-icon{width:54px;height:38px;min-width:54px;margin-right:16px}
  .task-title{font-size:24px}
  .task-arrow{font-size:48px}
}
/* الحالات الأخرى */
.records-empty{
  min-height:430px;border-radius:24px;background:rgba(230,240,254,.88);
  box-shadow:0 2px 12px #2d63af14;display:flex;align-items:center;
  justify-content:center;overflow:hidden;padding:25px;box-sizing:border-box;
}
.records-empty{flex-direction:column;gap:6px}
.records-empty svg{width:min(250px,58vw);height:auto;display:block}
.records-message{text-align:center;color:#397bdc;font-size:20px;font-weight:800;line-height:1.6}
.hidden{display:none!important}

.success-toast{
  position:fixed;z-index:9999;left:50%;bottom:118px;transform:translateX(-50%) translateY(20px);
  background:#fff;color:#168542;border-radius:15px;padding:14px 24px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:17px;font-weight:800;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
}
.success-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:380px){
  .records-hero h1{font-size:28px}
  .records-tab{font-size:16px}
  .task-title{font-size:16px}
}
</style>
</head>

<body>
<div class="app">
<main class="records-custom">

<section class="records-hero">
  <h1>الفرص المتاحة</h1>
  <div class="records-hero-row">
    <div class="records-zero" id="counter">0/3</div>
    <button class="records-tutorial" type="button">💡 Tutorial</button>
  </div>
</section>

<section class="records-tabs" aria-label="حالة المهام">
  <button class="records-tab" type="button" data-tab="rejected">رفض</button>
  <button class="records-tab" type="button" data-tab="complete">كامل</button>
  <button class="records-tab active" type="button" data-tab="progress">المهمة قيد<br>التقدم</button>
  <button class="records-tab" type="button" data-tab="withdrawn">تم التراجع عنه</button>
</section>

<section id="progressPanel" class="task-list"></section>

<section id="completePanel" class="records-empty hidden">
  <svg viewBox="0 0 260 260" aria-hidden="true">
<path class="s" d="M73 45h103l28 28v133H73z"/>
<path class="s" d="M176 45v30h28"/>
<path class="s" d="M96 89h72M96 112h72M96 135h50M96 158h40"/>
<circle cx="164" cy="156" r="45" fill="#fff" stroke="#397bdc" stroke-width="5"/>
<path class="s" d="M197 190l28 28"/>
<path class="s" d="M151 142l26 26M177 142l-26 26"/>
<path class="s" d="M57 71l10 10M57 211l10-10M213 91l10-10"/>
</svg>
  <div class="records-message" id="completeMessage">لا توجد مهام مكتملة بعد</div>
</section>

<section id="rejectedPanel" class="records-empty hidden">
  <svg viewBox="0 0 260 260" aria-hidden="true">
<path class="s" d="M73 45h103l28 28v133H73z"/>
<path class="s" d="M176 45v30h28"/>
<path class="s" d="M96 89h72M96 112h72M96 135h50M96 158h40"/>
<circle cx="164" cy="156" r="45" fill="#fff" stroke="#397bdc" stroke-width="5"/>
<path class="s" d="M197 190l28 28"/>
<path class="s" d="M151 142l26 26M177 142l-26 26"/>
<path class="s" d="M57 71l10 10M57 211l10-10M213 91l10-10"/>
</svg>
  <div class="records-message">لا توجد مهام مرفوضة</div>
</section>

<section id="withdrawnPanel" class="records-empty hidden">
  <svg viewBox="0 0 260 260" aria-hidden="true">
<path class="s" d="M73 45h103l28 28v133H73z"/>
<path class="s" d="M176 45v30h28"/>
<path class="s" d="M96 89h72M96 112h72M96 135h50M96 158h40"/>
<circle cx="164" cy="156" r="45" fill="#fff" stroke="#397bdc" stroke-width="5"/>
<path class="s" d="M197 190l28 28"/>
<path class="s" d="M151 142l26 26M177 142l-26 26"/>
<path class="s" d="M57 71l10 10M57 211l10-10M213 91l10-10"/>
</svg>
  <div class="records-message">لا توجد مهام تم التراجع عنها</div>
</section>

</main>
</div>

<div id="successToast" class="success-toast">اكتملت المهمة بنجاح ✓</div>

<script>
(function(){
  const TASKS = [
    {
      id: "youtube-1",
      title: "مهمة YouTube 1",
      url: "https://youtube.com/shorts/HIAB8zQoYDQ?si=NUg1BN4WXYJhbIcG"
    },
    {
      id: "youtube-2",
      title: "مهمة YouTube 2",
      url: "https://youtube.com/shorts/ODEcPZ_TC7o?si=OmQWJjUe6fU69ZoV"
    },
    {
      id: "youtube-3",
      title: "مهمة YouTube 3",
      url: "https://youtube.com/shorts/fyenktiDdq0?si=tHKSNzt7oD0opqfo"
    }
  ];

  const STORAGE_KEY = "acce_youtube_completed_v2";
  const PENDING_KEY = "acce_youtube_pending_v2";
  const CYCLE_START_KEY = "acce_youtube_cycle_start_v2";
  const RESET_AFTER = 10 * 60 * 1000; // 10 دقائق

  function getCompleted(){
    try {
      const started = Number(localStorage.getItem(CYCLE_START_KEY) || 0);
      if (started && Date.now() - started >= RESET_AFTER) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(CYCLE_START_KEY);
        return [];
      }
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch(e){ return []; }
  }

  function setCompleted(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    if(list.length && !localStorage.getItem(CYCLE_START_KEY)){
      localStorage.setItem(CYCLE_START_KEY, String(Date.now()));
    }
  }

  function completeTask(id){
    const completed = getCompleted();
    if(!completed.includes(id)){
      completed.push(id);
      setCompleted(completed);
    }
    localStorage.removeItem(PENDING_KEY);
    render();
    showSuccess();
  }

  function showSuccess(){
    const toast = document.getElementById("successToast");
    toast.classList.add("show");
    setTimeout(function(){ toast.classList.remove("show"); }, 2200);
  }

  function render(){
    const completed = getCompleted();
    const progress = document.getElementById("progressPanel");
    const completePanel = document.getElementById("completePanel");
    const counter = document.getElementById("counter");

    counter.textContent = completed.length + "/3";

    const remaining = TASKS.filter(t => !completed.includes(t.id));

    if(remaining.length === 0){
      progress.innerHTML =
        '<div class="records-empty" style="min-height:430px">' +
        '<div class="records-message">تم إكمال جميع المهام بنجاح ✓</div>' +
        '</div>';
    } else {
      progress.innerHTML = remaining.map(function(task){
        return '<button class="task-card" type="button" data-id="' + task.id + '">' +
          '<span class="task-icon" aria-hidden="true"></span>' +
          '<span class="task-info"><span class="task-title">1.50$</span></span>' +
          '<span class="task-arrow">›</span>' +
        '</button>';
      }).join("");
    }

    completePanel.innerHTML = completed.length
      ? '<div class="records-message">تم إكمال ' + completed.length + ' من 3 مهام ✓</div>'
      : '<div class="records-message">لا توجد مهام مكتملة بعد</div>';

    progress.querySelectorAll(".task-card").forEach(function(card){
      card.addEventListener("click", function(){
        const id = this.getAttribute("data-id");
        const task = TASKS.find(t => t.id === id);
        if(!task) return;

        // نحفظ المهمة قبل الانتقال إلى YouTube.
        // عند الرجوع إلى الموقع سيتم اعتبارها مكتملة.
        localStorage.setItem(PENDING_KEY, id);
        window.location.href = task.url;
      });
    });
  }

  function activateTab(name){
    document.querySelectorAll(".records-tab").forEach(function(tab){
      tab.classList.toggle("active", tab.getAttribute("data-tab") === name);
    });

    document.getElementById("progressPanel").classList.toggle("hidden", name !== "progress");
    document.getElementById("completePanel").classList.toggle("hidden", name !== "complete");
    document.getElementById("rejectedPanel").classList.toggle("hidden", name !== "rejected");
    document.getElementById("withdrawnPanel").classList.toggle("hidden", name !== "withdrawn");
  }

  document.querySelectorAll(".records-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      activateTab(this.getAttribute("data-tab"));
    });
  });

  /*
    pageshow يعمل عند الرجوع من YouTube بواسطة زر الرجوع.
    لذلك المهمة التي فتحها المستخدم تختفي وتنتقل إلى "كامل".
  */
  window.addEventListener("pageshow", function(){
    const pending = localStorage.getItem(PENDING_KEY);
    if(pending){
      completeTask(pending);
    } else {
      render();
    }
  });

  // فحص المؤقت كل ثانية؛ بعد 10 دقائق تعود المهام الثلاث تلقائياً.
  setInterval(function(){
    const started = Number(localStorage.getItem(CYCLE_START_KEY) || 0);
    if(started && Date.now() - started >= RESET_AFTER){
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(CYCLE_START_KEY);
      render();
    }
  }, 1000);

  render();
})();
</script>
